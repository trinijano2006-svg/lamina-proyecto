<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lámina 31 Minutos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #1a1a1a;
    }

    /* Contenedor responsivo en pantalla completa */
    .pdf-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Visor embebido */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="pdf-container">
    <iframe src="Lamina_31_Minutos.pdf#toolbar=0&navpanes=0&scrollbar=0" type="application/pdf">
      <p>Tu navegador no soporta la visualización directa de archivos PDF. 
         <a href="Lamina_31_Minutos.pdf">Haz clic aquí para descargar o ver el archivo.</a>
      </p>
    </iframe>
  </div>

</body>
</html>
